name: Publish to npm

# Publishes the built package to the PUBLIC npm registry when a version tag
# (e.g. v0.3.0) is pushed. Installing needs no token; publishing uses the
# NPM_TOKEN repository secret (an npm automation token).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check bundle size
        run: npm run check:size

      - name: Build library
        run: npm run build:lib

      - name: Check packed contents include dist/
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const pkg = require('./package.json');
            const need = [pkg.main, pkg.module, pkg.types, pkg.exports['./style.css']]
              .map(f => f.replace(/^\.\//, ''));
            const missing = need.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from package:', missing); process.exit(1); }
          "
          rm pack.json

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
